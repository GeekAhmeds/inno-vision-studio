[project]
name = "inno-vision-studio"
version = "0.1.0"
description = "Guided studio for building, measuring and publishing vision models for any counted product."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "keyring>=25.0",
    "inno-count[onnx]",
]

[project.scripts]
studio = "studio.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "onnx>=1.16"]

[tool.uv.workspace]
members = ["packages/inno_count"]

[tool.uv.sources]
inno-count = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "studio/_web"

[tool.pytest.ini_options]
testpaths = ["tests"]
